<!DOCTYPE html>
<html lang="en">
<head>
        <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wes's Stash Thingy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #000;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* No decorative circles, no gradients, no glow — removed */
        .circles { display: none; }

        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ── Menu toggle ────────────────────────────────────────── */
        .menu-toggle {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 300;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: #111;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .menu-toggle:hover {
            background: #1a1a1a;
            border-color: #444;
        }

        .menu-toggle span {
            display: block;
            width: 18px;
            height: 2px;
            background: #fff;
            border-radius: 1px;
            transition: all 0.25s ease;
        }

        .menu-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-toggle.active span:nth-child(2) { opacity: 0; }
        .menu-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* ── Sidebar ────────────────────────────────────────────── */
        .categories-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: #0a0a0a;
            border-right: 1px solid #1e1e1e;
            z-index: 250;
            transform: translateX(-100%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 28px 16px 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            scrollbar-width: thin;
            scrollbar-color: #2a2a2a #0a0a0a;
        }

        .categories-panel.open { transform: translateX(0); }

        .sidebar-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid #1e1e1e;
        }

        .sidebar-logo img {
            max-width: 120px;
            height: auto;
            opacity: 0.92;
        }

        .categories-panel h3 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555;
            margin-bottom: 12px;
            padding-left: 6px;
            font-weight: 700;
        }

        .category-btn {
            display: block;
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 3px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 7px;
            color: #888;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }

        .category-btn:hover {
            background: #141414;
            border-color: #2a2a2a;
            color: #e0e0e0;
        }

        .category-btn.active {
            background: #fff;
            border-color: #fff;
            color: #000;
            font-weight: 700;
        }

        /* ── Overlay ─────────────────────────────────────────────── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .overlay.show { opacity: 1; visibility: visible; }

        /* ── Main content ────────────────────────────────────────── */
        .main-content {
            padding: 28px 20px 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 8px;
        }

        .header h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 6px;
        }

        .header h1 img {
            height: 40px;
            width: auto;
        }

        .credits {
            color: #555;
            font-size: 13px;
        }

        /* ── Search ──────────────────────────────────────────────── */
        .search-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        #searchInput {
            width: 100%;
            max-width: 440px;
            padding: 13px 18px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            background: #0f0f0f;
            color: #fff;
            outline: none;
            transition: border-color 0.2s ease;
            font-family: inherit;
        }

        #searchInput::placeholder { color: #444; }

        #searchInput:focus {
            border-color: #555;
        }

        #suggestGamesBtn {
            background: #fff;
            border: 1px solid #fff;
            color: #000;
            padding: 10px 20px;
            border-radius: 7px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
            text-decoration: none;
            display: inline-block;
            font-family: inherit;
        }

        #suggestGamesBtn:hover {
            background: #e0e0e0;
            border-color: #e0e0e0;
        }

        #lolbutton {
            background: #111;
            border: 1px solid #2a2a2a;
            color: #888;
            padding: 8px 16px;
            border-radius: 7px;
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease;
            font-family: inherit;
        }

        #lolbutton:hover {
            border-color: #444;
            color: #ccc;
        }

        /* ── Game sections ───────────────────────────────────────── */
        #sections-container {
            flex: 1;
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
        }

        .letter-section {
            margin-bottom: 40px;
            content-visibility: auto;
            contain: layout style;
        }

        .letter-header {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #444;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1a1a1a;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        input[type="button"] {
            background: #0f0f0f;
            border: 1px solid #1e1e1e;
            padding: 13px 20px;
            font-size: 14.5px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 620px;
            color: #d4d4d4;
            text-align: left;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
            font-family: inherit;
        }

        input[type="button"]:hover {
            background: #161616;
            border-color: #333;
            color: #fff;
        }

        input[type="button"]:active {
            background: #1e1e1e;
        }

        /* ── Empty / footer ─────────────────────────────────────── */
        .empty-message {
            color: #444;
            font-style: italic;
            text-align: center;
            padding: 30px;
        }

        .site-footer {
            text-align: center;
            color: #444;
            font-size: 12px;
            padding: 32px 0 16px;
            margin-top: 40px;
            border-top: 1px solid #141414;
        }

        .footer-link-blue {
            color: #888;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-link-blue:hover { color: #ccc; }

        /* ── Other sites ─────────────────────────────────────────── */
        .other-sites-section {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid #1e1e1e;
        }

        .other-sites-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }

        .other-site-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 7px;
            border: 1px solid transparent;
            color: #777;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .other-site-link:hover {
            background: #141414;
            border-color: #2a2a2a;
            color: #e0e0e0;
        }

        .other-site-link img {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            object-fit: contain;
            background: #1a1a1a;
            flex-shrink: 0;
        }

        .other-site-link .site-fallback {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #000;
            background: #fff;
            flex-shrink: 0;
        }

        /* ── Boot loader ─────────────────────────────────────────── */
        #boot-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #boot-loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .boot-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            animation: bootPulse 2s ease-in-out infinite;
        }

        .boot-logo-fallback {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 800;
            color: #000;
            animation: bootPulse 2s ease-in-out infinite;
        }

        .boot-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #fff;
        }

        .boot-status {
            min-height: 1.4em;
            font-size: 13px;
            color: #555;
            text-align: center;
            padding: 0 16px;
        }

        .boot-credit {
            min-height: 1.5em;
            font-size: 13px;
            font-weight: 600;
            color: #888;
            letter-spacing: 0.08em;
            font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace;
        }

        .boot-credit .cursor {
            display: inline-block;
            width: 0.55ch;
            margin-left: 1px;
            background: #888;
            animation: blink 0.9s step-end infinite;
            vertical-align: -1px;
            height: 1.05em;
        }

        .boot-bar {
            width: min(200px, 60vw);
            height: 2px;
            border-radius: 99px;
            background: #1a1a1a;
            overflow: hidden;
            margin-top: 4px;
        }

        .boot-bar-fill {
            height: 100%;
            width: 35%;
            border-radius: 99px;
            background: #fff;
            animation: bootSlide 1.2s ease-in-out infinite;
        }

        @keyframes bootPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.6; }
        }
        @keyframes bootSlide {
            0% { transform: translateX(-150%); }
            100% { transform: translateX(380%); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @media (max-width: 768px) {
            .main-content { padding: 20px 12px 36px; }
            .header h1 { font-size: 1.5rem; }
            .header h1 img { height: 32px; }
            .categories-panel { width: 240px; }
        }
    </style>
</head>
<body>

    <div id="boot-loader" aria-busy="true" aria-label="Loading">
        <img class="boot-logo" src="logo.png" alt="Logo" onerror="this.style.display='none';document.getElementById('bootLogoFb').style.display='flex'">
        <div id="bootLogoFb" class="boot-logo-fallback" style="display:none">W</div>
        <div class="boot-title">Wes's Stash Thingy</div>
        <div class="boot-status" id="bootStatus">Waking up the stash…</div>
        <div class="boot-credit" id="bootCredit"><span id="bootType"></span><span class="cursor"></span></div>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
    </div>

    <div class="circles">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <canvas id="particleCanvas"></canvas>

  
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle categories">
        <span></span>
        <span></span>
        <span></span>
    </button>


    <div class="overlay" id="overlay"></div>

 
    <div class="categories-panel" id="categoriesPanel">
        <div class="sidebar-logo">
            <img src="logo.png" alt="Logo">
        </div>

        <h3>Categories</h3>
        <button class="category-btn active" data-category="all">All Games</button>
        <button class="category-btn" data-category="action">Action & Shooters</button>
        <button class="category-btn" data-category="puzzle">Puzzle & Brain</button>
        <button class="category-btn" data-category="multiplayer">Multiplayer</button>
        <button class="category-btn" data-category="idle">Idle & Clicker</button>
        <button class="category-btn" data-category="racing">Racing & Driving</button>
        <button class="category-btn" data-category="platformer">Platformers</button>
        <button class="category-btn" data-category="horror">Horror</button>
        <button class="category-btn" data-category="sports">Sports</button>
        <button class="category-btn" data-category="retro">Retro & Arcade</button>
        <button class="category-btn" data-category="strategy">Strategy</button>

        <div class="other-sites-section">
            <h3>Other Sites</h3>
            <div class="other-sites-list" id="otherSitesList"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>
                <img src="logo.png" alt="Logo">
                <span>Wes's Stash Thingy</span>
            </h1>
            <p class="credits">Credits to Wes & Mason for finding the games</p>
        </div>

        <div class="search-area">
            <div class="top-actions">
                <a id="suggestGamesBtn" href="https://docs.google.com/forms/d/e/1FAIpQLSf-uFCzfquDcTrgAQ2Oo6rZA6vUGX338duyJzk6AKo7G0VVfQ/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer">Suggest Games</a>
</div>
            <input type="text" placeholder="Search games..." id="searchInput">
            <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/searchbut.js"></script>
            <button id="lolbutton" onclick="const script = document.createElement('script');script.src = 'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@latest/game.js';document.body.appendChild(script);">
                Click to load if it isn't loading
            </button>
        </div>

        <div id="sections-container"></div>

        <footer class="site-footer">
            Made by Wes • © 2026 Crown Games. All rights reserved. |
            <a href="privacy.html" class="footer-link-blue">Privacy Policy</a>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>
    <script>

        const categoryKeywords = {
            action: ['shoot', 'gun', 'war', 'battle', 'fight', 'combat', 'doom', 'bullet', 'zombie', 'kill', 'assassin', 'strike'],
            puzzle: ['puzzle', '2048', 'match', 'block', 'sudoku', 'brain', 'logic', 'tetris', 'slide'],
            multiplayer: ['multi', 'versus', '1v1', '2 player', '3 player', '4 player', 'online', 'pvp'],
            idle: ['idle', 'clicker', 'incremental', 'tycoon', 'capitalist', 'merge'],
            racing: ['race', 'car', 'drive', 'drift', 'moto', 'bike', 'speed', 'track'],
            platformer: ['platform', 'jump', 'mario', 'adventure', 'run', 'dash', 'geometry'],
            horror: ['horror', 'scary', 'fear', 'nightmare', 'dark', 'ghost', 'haunt', 'dead'],
            sports: ['soccer', 'football', 'basket', 'tennis', 'golf', 'sport', 'ball'],
            retro: ['nes', 'snes', 'arcade', 'retro', 'classic', '8bit', '16bit', 'pixel'],
            strategy: ['strategy', 'tower', 'defense', 'empire', 'war', 'tactics', 'chess', 'age of']
        };

        const menuToggle = document.getElementById('menuToggle');
        const categoriesPanel = document.getElementById('categoriesPanel');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            menuToggle.classList.toggle('active');
            categoriesPanel.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        menuToggle.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        let currentCategory = 'all';

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                filterGames();
                if (window.innerWidth < 900) toggleMenu();
            });
        });

        function filterGames() {
            const buttons = document.querySelectorAll('input[type="button"]');
            const sections = document.querySelectorAll('.letter-section');

            buttons.forEach(btn => {
                const text = (btn.value || '').toLowerCase();
                let show = currentCategory === 'all';

                if (!show && categoryKeywords[currentCategory]) {
                    show = categoryKeywords[currentCategory].some(kw => text.includes(kw));
                }

                btn.style.display = show ? '' : 'none';
            });

            sections.forEach(section => {
                const visibleButtons = section.querySelectorAll('input[type="button"]:not([style*="display: none"])');
                section.style.display = visibleButtons.length > 0 ? '' : 'none';
            });
        }

        function addSpacesBetweenWords(str) {
            return str
                .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
                .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function stripCl(el) {
            if (el.id === 'menuToggle' || el.classList.contains('menu-toggle')) return;

            if (el.tagName === 'INPUT' && el.type === 'button') {
                let val = el.value;
                if (val.startsWith('cl')) val = val.slice(2);
                el.value = addSpacesBetweenWords(val);
            }

            if (el.tagName === 'BUTTON' && el.id !== 'menuToggle' && !el.classList.contains('menu-toggle')) {
                let txt = el.textContent.trimStart();
                if (txt.startsWith('cl')) {
                    txt = txt.slice(2);
                    el.textContent = addSpacesBetweenWords(txt);
                }
            }
        }

        setTimeout(() => {
            document.querySelectorAll('input[type="button"], button').forEach(stripCl);
        }, 800);

        const observer = new MutationObserver(mutations => {
            for (const mutation of mutations) {
                for (const node of mutation.addedNodes) {
                    if (node.nodeType !== 1) continue;
                    if (node.tagName === 'INPUT' || node.tagName === 'BUTTON') stripCl(node);
                    node.querySelectorAll && node.querySelectorAll('input[type="button"], button').forEach(stripCl);
                }
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        const OTHER_SITES = [
            { name: "working on this", logo: "say wallahi bro\\image.png", path: "index.html" },
        ];

        function makeSiteFallback(name) {
            const d = document.createElement('div');
            d.className = 'site-fallback';
            const m = String(name || '?').match(/[a-zA-Z0-9]/);
            d.textContent = (m ? m[0] : '?').toUpperCase();
            return d;
        }

        function renderOtherSites() {
            const listEl = document.getElementById('otherSitesList');
            if (!listEl) return;
            listEl.innerHTML = '';
            OTHER_SITES.forEach(site => {
                if (!site || !site.path) return;
                const a = document.createElement('a');
                a.className = 'other-site-link';
                a.href = site.path;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.title = site.name || 'Site';

                if (site.logo) {
                    const img = document.createElement('img');
                    img.src = site.logo;
                    img.alt = '';
                    img.onerror = function () {
                        img.replaceWith(makeSiteFallback(site.name));
                    };
                    a.appendChild(img);
                } else {
                    a.appendChild(makeSiteFallback(site.name));
                }

                const span = document.createElement('span');
                span.textContent = site.name || 'Untitled';
                a.appendChild(span);
                listEl.appendChild(a);
            });
        }

        renderOtherSites();

        // ===== Boot loader =====
        (function () {
            const loader = document.getElementById('boot-loader');
            if (!loader) return;
            const statusEl = document.getElementById('bootStatus');
            const typeEl = document.getElementById('bootType');
            const MIN_MS = 2200;
            const MAX_MS = 4800;
            const start = Date.now();
            let done = false;

            const lines = [
                'Waking up the stash…',
                'Sorting the games…',
                'Bribing the CDN…',
                'Hiding from the firewall…',
                'Almost there…',
            ];
            let lineIndex = 0;
            if (statusEl) {
                statusEl.textContent = lines[0];
                const lineTimer = setInterval(() => {
                    if (done) { clearInterval(lineTimer); return; }
                    lineIndex = (lineIndex + 1) % lines.length;
                    statusEl.textContent = lines[lineIndex];
                }, 700);
            }

    
            const credit = 'made by wes';
            let ti = 0;
            function typeNext() {
                if (!typeEl || done && ti >= credit.length) return;
                if (ti <= credit.length) {
                    typeEl.textContent = credit.slice(0, ti);
                    ti++;
                    setTimeout(typeNext, ti === 1 ? 400 : 75);
                }
            }
            setTimeout(typeNext, 350);

            function hideLoader() {
                if (done) return;
                done = true;
                const wait = Math.max(0, MIN_MS - (Date.now() - start));
                setTimeout(() => {
                    if (typeEl) typeEl.textContent = credit;
                    loader.classList.add('hide');
                    loader.setAttribute('aria-busy', 'false');
                    setTimeout(() => { try { loader.remove(); } catch (_) {} }, 600);
                }, wait);
            }

            const bootObs = new MutationObserver(() => {
                if (document.querySelectorAll('#sections-container input[type="button"]').length > 5) {
                    bootObs.disconnect();
                    hideLoader();
                }
            });

    </script>    <script>
        // ── Particle network background ───────────────────────────────────────────
        (function () {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');

            const PARTICLE_COUNT = 88;
            const MAX_DIST       = 148;   // max px to draw a line
            const SPEED          = 0.38;  // base movement speed
            const DOT_RADIUS     = 1.8;
            const DOT_COLOR      = 'rgba(255,255,255,0.55)';
            const LINE_MAX_ALPHA = 0.18;

            let W, H, particles = [], raf;

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            function Particle() {
                this.x  = Math.random() * W;
                this.y  = Math.random() * H;
                this.vx = (Math.random() - 0.5) * SPEED * 2;
                this.vy = (Math.random() - 0.5) * SPEED * 2;
                // keep minimum speed so nothing stalls
                if (Math.abs(this.vx) < 0.08) this.vx = this.vx < 0 ? -0.08 : 0.08;
                if (Math.abs(this.vy) < 0.08) this.vy = this.vy < 0 ? -0.08 : 0.08;
            }

            Particle.prototype.update = function () {
                this.x += this.vx;
                this.y += this.vy;
                // bounce off edges
                if (this.x < 0)  { this.x = 0;  this.vx *= -1; }
                if (this.x > W)  { this.x = W;  this.vx *= -1; }
                if (this.y < 0)  { this.y = 0;  this.vy *= -1; }
                if (this.y > H)  { this.y = H;  this.vy *= -1; }
            };

            function init() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);

                // update positions
                for (let i = 0; i < particles.length; i++) particles[i].update();

                // draw lines between close particles
                for (let i = 0; i < particles.length; i++) {
                    const a = particles[i];
                    for (let j = i + 1; j < particles.length; j++) {
                        const b = particles[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > MAX_DIST) continue;
                        const alpha = LINE_MAX_ALPHA * (1 - dist / MAX_DIST);
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }

                // draw dots on top
                ctx.fillStyle = DOT_COLOR;
                for (let i = 0; i < particles.length; i++) {
                    ctx.beginPath();
                    ctx.arc(particles[i].x, particles[i].y, DOT_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                }

                raf = requestAnimationFrame(draw);
            }

            window.addEventListener('resize', () => { resize(); init(); });
            resize();
            init();
            draw();
        })();
    </script>
